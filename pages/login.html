<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Premium Dairy SaaS</title>
  
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/layout.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <link rel="stylesheet" href="../assets/css/forms.css">
  <link rel="stylesheet" href="../assets/css/animations.css">
  
  <style>
    .auth-bg {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      overflow: hidden;
      z-index: 0;
    }
    .auth-bg-blob {
      position: absolute;
      filter: blur(80px);
      border-radius: 50%;
      opacity: 0.6;
      animation: pulse 4s infinite alternate;
    }
    .blob-1 { top: -10%; left: -10%; width: 500px; height: 500px; background: var(--color-brand-light); }
    .blob-2 { bottom: -10%; right: -10%; width: 600px; height: 600px; background: var(--color-success-light); animation-delay: 2s; }
  </style>
</head>
<body class="animate-fade-in" style="background-color: var(--color-bg-body);">

  <div class="auth-bg">
    <div class="auth-bg-blob blob-1"></div>
    <div class="auth-bg-blob blob-2"></div>
  </div>

  <div class="auth-layout" style="position: relative; z-index: 1;">
    <div class="auth-container card-glass animate-slide-up">
      <div class="auth-header">
        <div class="auth-logo">
          <div class="logo-icon" style="width: 56px; height: 56px; font-size: 2rem; margin: 0 auto;">
            <i class="ph ph-drop"></i>
          </div>
        </div>
        <h1 class="auth-title">Welcome back</h1>
        <p class="auth-subtitle">Enter your credentials to access your dashboard</p>
      </div>
      
      <form id="login-form">
        <div class="form-group">
          <label class="form-label">Email <span class="required">*</span></label>
          <div class="input-icon-wrapper">
            <i class="ph ph-envelope input-icon text-lg"></i>
            <input type="email" class="form-control" placeholder="admin@premiumdairy.com" value="admin@premiumdairy.com" required>
          </div>
        </div>
        
        <div class="form-group">
          <div class="flex justify-between items-center mb-1">
            <label class="form-label" style="margin-bottom:0">Password <span class="required">*</span></label>
            <a href="#" class="text-xs text-brand hover:underline">Forgot password?</a>
          </div>
          <div class="input-icon-wrapper">
            <i class="ph ph-lock input-icon text-lg"></i>
            <input type="password" class="form-control" placeholder="••••••••" value="password" required>
          </div>
        </div>
        
        <div class="form-group">
          <label class="form-check">
            <input type="checkbox" class="form-check-input" checked>
            <span class="form-check-label">Remember me for 30 days</span>
          </label>
        </div>
        
        <button type="submit" class="btn btn-primary btn-lg w-full ripple" style="margin-top: 1rem;">
          Sign In <i class="ph ph-arrow-right"></i>
        </button>
      </form>
      
      <div class="text-center" style="margin-top: 2rem;">
        <p class="text-sm text-secondary">Don't have an account? <a href="#" class="text-brand font-medium hover:underline">Contact Sales</a></p>
      </div>
    </div>
  </div>

  <script src="../assets/js/storage.js"></script>
  <script src="../assets/js/utils.js"></script>
  <script src="../assets/js/theme.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      Theme.init();
      
      const form = document.getElementById('login-form');
      form.addEventListener('submit', (e) => {
        e.preventDefault();
        
        const btn = form.querySelector('button[type="submit"]');
        const originalText = btn.innerHTML;
        btn.innerHTML = '<i class="ph ph-spinner ph-spin"></i> Signing in...';
        btn.disabled = true;
        
        // Simulate network request
        setTimeout(() => {
          Utils.showToast('Success', 'Logged in successfully', 'success');
          setTimeout(() => {
            window.location.href = 'dashboard.html';
          }, 800);
        }, 1200);
      });
    });
  </script>
</body>
</html>
