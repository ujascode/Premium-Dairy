<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reports | Premium Dairy SaaS</title>
  
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/layout.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <link rel="stylesheet" href="../assets/css/forms.css">
  <link rel="stylesheet" href="../assets/css/animations.css">
</head>
<body class="animate-fade-in">

  <div class="app-container">
    <div id="sidebar-container"></div>
    <main class="main-wrapper">
      <div id="navbar-container"></div>

      <div class="page-content">
        <div class="page-header">
          <div class="page-title">
            <h1 class="text-h2">Export & Reports</h1>
          </div>
        </div>

        <div class="dashboard-grid animate-slide-up">
          
          <div class="card" style="grid-column: span 6;">
            <div class="card-header">
              <h3 class="card-title">Generate Report</h3>
            </div>
            <div class="card-body">
              <div class="form-group">
                <label class="form-label">Report Type</label>
                <select class="form-control">
                  <option>Sales Summary</option>
                  <option>Inventory Status</option>
                  <option>Tax Statement (GST)</option>
                  <option>Customer Activity</option>
                </select>
              </div>
              <div class="flex gap-4 mb-4">
                <div class="form-group flex-1 m-0">
                  <label class="form-label">Start Date</label>
                  <input type="date" class="form-control" value="2026-07-01">
                </div>
                <div class="form-group flex-1 m-0">
                  <label class="form-label">End Date</label>
                  <input type="date" class="form-control" value="2026-07-31">
                </div>
              </div>
              <div class="form-group">
                <label class="form-label">Format</label>
                <div class="flex gap-2">
                  <label class="form-check flex-1 bg-surface border rounded p-2">
                    <input type="radio" name="format" value="pdf" class="form-check-input" checked> PDF Format
                  </label>
                  <label class="form-check flex-1 bg-surface border rounded p-2">
                    <input type="radio" name="format" value="csv" class="form-check-input"> CSV Format
                  </label>
                </div>
              </div>
              <button class="btn btn-brand w-full ripple mt-2" onclick="Utils.showToast('Generating', 'Your report is being generated and will download shortly.', 'success')">
                <i class="ph ph-download-simple text-lg"></i> Download Report
              </button>
            </div>
          </div>

          <div class="card" style="grid-column: span 6;">
            <div class="card-header">
              <h3 class="card-title">Recent Downloads</h3>
            </div>
            <div class="card-body p-0">
              <div class="flex flex-col">
                <div class="flex justify-between items-center p-4 border-b">
                  <div class="flex items-center gap-3">
                    <div class="avatar avatar-sm bg-danger-light text-danger"><i class="ph ph-file-pdf"></i></div>
                    <div>
                      <div class="font-medium">July_Sales_Summary.pdf</div>
                      <div class="text-xs text-secondary">Generated today, 10:42 AM</div>
                    </div>
                  </div>
                  <button class="btn-icon"><i class="ph ph-download-simple"></i></button>
                </div>
                <div class="flex justify-between items-center p-4 border-b">
                  <div class="flex items-center gap-3">
                    <div class="avatar avatar-sm bg-success-light text-success"><i class="ph ph-file-csv"></i></div>
                    <div>
                      <div class="font-medium">Inventory_Audit_Q2.csv</div>
                      <div class="text-xs text-secondary">Generated 2 days ago</div>
                    </div>
                  </div>
                  <button class="btn-icon"><i class="ph ph-download-simple"></i></button>
                </div>
                <div class="flex justify-between items-center p-4">
                  <div class="flex items-center gap-3">
                    <div class="avatar avatar-sm bg-brand-light text-brand"><i class="ph ph-file-doc"></i></div>
                    <div>
                      <div class="font-medium">Tax_Report_June2026.docx</div>
                      <div class="text-xs text-secondary">Generated 1 week ago</div>
                    </div>
                  </div>
                  <button class="btn-icon"><i class="ph ph-download-simple"></i></button>
                </div>
              </div>
            </div>
          </div>
          
        </div>
      </div>
    </main>
  </div>

  <script src="../assets/js/storage.js"></script>
  <script src="../assets/js/utils.js"></script>
  <script src="../assets/js/theme.js"></script>
  <script src="../assets/js/app.js"></script>
</body>
</html>
