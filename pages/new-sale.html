<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>New Sale | Premium Dairy SaaS</title>
  
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/layout.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <link rel="stylesheet" href="../assets/css/forms.css">
  <link rel="stylesheet" href="../assets/css/tables.css">
  <link rel="stylesheet" href="../assets/css/animations.css">
  
  <style>
    .pos-grid {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 1.5rem;
      align-items: start;
    }
    
    .pos-products {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 1rem;
      max-height: 60vh;
      overflow-y: auto;
      padding: 0.5rem;
    }
    
    .pos-product-card {
      background-color: var(--color-bg-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      padding: 1rem;
      cursor: pointer;
      text-align: center;
      transition: all var(--transition-fast);
      user-select: none;
    }
    
    .pos-product-card:hover {
      border-color: var(--color-brand);
      box-shadow: 0 4px 12px var(--color-brand-light);
      transform: translateY(-2px);
    }
    
    .pos-product-card.out-of-stock {
      opacity: 0.5;
      pointer-events: none;
    }
    
    .pos-product-icon {
      width: 48px;
      height: 48px;
      background-color: var(--color-bg-body);
      border-radius: 50%;
      margin: 0 auto 0.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      color: var(--color-text-secondary);
    }
    
    .pos-product-name {
      font-size: var(--font-size-sm);
      font-weight: 600;
      margin-bottom: 0.25rem;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    
    .pos-product-price {
      color: var(--color-brand);
      font-weight: 700;
    }
    
    .cart-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.75rem 0;
      border-bottom: 1px dashed var(--color-border);
    }
    
    .qty-control {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    
    .qty-btn {
      width: 24px;
      height: 24px;
      border-radius: 4px;
      background-color: var(--color-bg-body);
      border: 1px solid var(--color-border);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    
    .qty-btn:hover {
      background-color: var(--color-bg-surface-hover);
    }
    
    .cart-summary {
      background-color: var(--color-bg-body);
      border-radius: var(--radius-md);
      padding: 1rem;
      margin-top: 1rem;
    }
    
    .summary-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 0.5rem;
      font-size: var(--font-size-sm);
    }
    
    .summary-row.total {
      border-top: 1px solid var(--color-border);
      padding-top: 0.5rem;
      font-size: var(--font-size-lg);
      font-weight: 700;
      margin-bottom: 0;
    }
    
    @media (max-width: 992px) {
      .pos-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body class="animate-fade-in">

  <div class="app-container">
    <div id="sidebar-container"></div>
    <main class="main-wrapper">
      <div id="navbar-container"></div>

      <div class="page-content">
        <div class="page-header mb-4">
          <div class="page-title">
            <h1 class="text-h2">Point of Sale</h1>
          </div>
        </div>

        <div class="pos-grid animate-slide-up">
          
          <!-- Products Area -->
          <div class="card h-full">
            <div class="card-header flex justify-between">
              <div class="search-container" style="width: 100%;">
                <i class="ph ph-magnifying-glass input-icon text-lg" style="left: 1rem"></i>
                <input type="text" class="search-input" id="pos-search" placeholder="Search products (barcode scanner ready)..." autofocus>
              </div>
            </div>
            
            <div class="card-body p-0">
              <div class="flex gap-2 p-3 overflow-x-auto border-b" id="pos-categories" style="border-bottom: 1px solid var(--color-border)">
                <button class="badge badge-brand" style="border:none; cursor:pointer;" onclick="filterPos('all')">All</button>
                <!-- Injected via JS -->
              </div>
              
              <div class="pos-products" id="pos-products-grid">
                <!-- Injected via JS -->
              </div>
            </div>
          </div>
          
          <!-- Cart Area -->
          <div class="card h-full flex-col">
            <div class="card-header">
              <h3 class="card-title">Current Order</h3>
              <button class="btn-icon text-danger" title="Clear Order" onclick="clearCart()"><i class="ph ph-trash"></i></button>
            </div>
            
            <div class="card-body flex-1" style="display:flex; flex-direction:column;">
              <div class="form-group">
                <select class="form-control" id="pos-customer">
                  <option value="">Walk-in Customer</option>
                  <!-- Injected via JS -->
                </select>
              </div>
              
              <div id="cart-items" style="flex:1; overflow-y:auto;">
                <!-- Cart items injected here -->
                <div class="empty-state" style="padding: 2rem;">
                  <i class="ph ph-shopping-cart text-3xl text-tertiary mb-2"></i>
                  <p class="text-sm">Cart is empty</p>
                </div>
              </div>
              
              <div class="cart-summary">
                <div class="summary-row">
                  <span class="text-secondary">Subtotal</span>
                  <span id="cart-subtotal">₹0.00</span>
                </div>
                <div class="summary-row">
                  <span class="text-secondary">Tax (18% GST)</span>
                  <span id="cart-tax">₹0.00</span>
                </div>
                <div class="summary-row">
                  <span class="text-secondary">Discount</span>
                  <span class="text-success">-₹0.00</span>
                </div>
                <div class="summary-row total">
                  <span>Total</span>
                  <span class="text-brand" id="cart-total">₹0.00</span>
                </div>
              </div>
              
              <div class="form-group mt-4 mb-2">
                <label class="form-label">Payment Method</label>
                <div class="flex gap-2">
                  <label class="form-check flex-1 bg-surface border rounded p-2" style="border: 1px solid var(--color-border);">
                    <input type="radio" name="payment" value="Cash" class="form-check-input" checked> Cash
                  </label>
                  <label class="form-check flex-1 bg-surface border rounded p-2" style="border: 1px solid var(--color-border);">
                    <input type="radio" name="payment" value="Card" class="form-check-input"> Card
                  </label>
                </div>
              </div>
              
              <button class="btn btn-primary btn-lg w-full ripple mt-2" id="btn-checkout" disabled>
                Complete Payment <i class="ph ph-check-circle"></i>
              </button>
            </div>
          </div>
          
        </div>
      </div>
    </main>
  </div>

  <script src="../assets/js/storage.js"></script>
  <script src="../assets/js/utils.js"></script>
  <script src="../assets/js/theme.js"></script>
  <script src="../assets/js/app.js"></script>
  <script>
    // Inline logic for POS for rapid development
    document.addEventListener('DOMContentLoaded', () => {
      setTimeout(initPos, 50);
    });
    
    let posProducts = [];
    let cart = [];
    
    function initPos() {
      posProducts = Storage.getProducts();
      renderPosProducts(posProducts);
      
      const custSelect = document.getElementById('pos-customer');
      Storage.getCustomers().forEach(c => {
        const opt = document.createElement('option');
        opt.value = c.id;
        opt.textContent = `${c.name} (${c.phone})`;
        custSelect.appendChild(opt);
      });
      
      document.getElementById('pos-search').addEventListener('input', (e) => {
        const term = e.target.value.toLowerCase();
        renderPosProducts(posProducts.filter(p => p.name.toLowerCase().includes(term) || p.sku.toLowerCase().includes(term)));
      });
      
      document.getElementById('btn-checkout').addEventListener('click', checkout);
    }
    
    function renderPosProducts(products) {
      const grid = document.getElementById('pos-products-grid');
      grid.innerHTML = products.map(p => {
        const isOut = p.stock === 0;
        return `
          <div class="pos-product-card ${isOut ? 'out-of-stock' : 'ripple'}" onclick="addToCart('${p.id}')">
            <div class="pos-product-icon"><i class="ph ph-package"></i></div>
            <div class="pos-product-name">${p.name}</div>
            <div class="pos-product-price">${Utils.formatCurrency(p.price)}</div>
            <div class="text-xs ${p.stock < 10 ? 'text-danger' : 'text-secondary'} mt-1">${p.stock} left</div>
          </div>
        `;
      }).join('');
    }
    
    function addToCart(productId) {
      const product = posProducts.find(p => p.id === productId);
      if (!product || product.stock === 0) return;
      
      const existing = cart.find(item => item.productId === productId);
      if (existing) {
        if (existing.qty < product.stock) existing.qty++;
        else Utils.showToast('Stock Limit', 'Cannot add more than available stock', 'warning');
      } else {
        cart.push({ productId, name: product.name, price: product.price, qty: 1, maxQty: product.stock });
      }
      
      updateCartUI();
    }
    
    function updateCartQty(productId, delta) {
      const item = cart.find(i => i.productId === productId);
      if (!item) return;
      
      item.qty += delta;
      if (item.qty <= 0) {
        cart = cart.filter(i => i.productId !== productId);
      } else if (item.qty > item.maxQty) {
        item.qty = item.maxQty;
      }
      
      updateCartUI();
    }
    
    function clearCart() {
      cart = [];
      updateCartUI();
    }
    
    function updateCartUI() {
      const cartDiv = document.getElementById('cart-items');
      const btnCheckout = document.getElementById('btn-checkout');
      
      if (cart.length === 0) {
        cartDiv.innerHTML = `
          <div class="empty-state" style="padding: 2rem;">
            <i class="ph ph-shopping-cart text-3xl text-tertiary mb-2"></i>
            <p class="text-sm">Cart is empty</p>
          </div>
        `;
        btnCheckout.disabled = true;
        document.getElementById('cart-subtotal').textContent = '₹0.00';
        document.getElementById('cart-tax').textContent = '₹0.00';
        document.getElementById('cart-total').textContent = '₹0.00';
        return;
      }
      
      btnCheckout.disabled = false;
      
      cartDiv.innerHTML = cart.map(item => `
        <div class="cart-item">
          <div class="flex-1">
            <div class="font-medium text-sm">${item.name}</div>
            <div class="text-xs text-brand">${Utils.formatCurrency(item.price)}</div>
          </div>
          <div class="qty-control">
            <button class="qty-btn" onclick="updateCartQty('${item.productId}', -1)"><i class="ph ph-minus"></i></button>
            <span class="text-sm w-4 text-center font-medium">${item.qty}</span>
            <button class="qty-btn" onclick="updateCartQty('${item.productId}', 1)"><i class="ph ph-plus"></i></button>
          </div>
          <div class="font-semibold text-sm ml-4 w-16 text-right">
            ${Utils.formatCurrency(item.price * item.qty)}
          </div>
        </div>
      `).join('');
      
      // Calculations
      const subtotal = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
      const taxRate = Storage.getSettings().taxRate / 100;
      const tax = subtotal * taxRate;
      const total = subtotal + tax;
      
      document.getElementById('cart-subtotal').textContent = Utils.formatCurrency(subtotal);
      document.getElementById('cart-tax').textContent = Utils.formatCurrency(tax);
      document.getElementById('cart-total').textContent = Utils.formatCurrency(total);
    }
    
    function checkout() {
      const custSelect = document.getElementById('pos-customer');
      const customerId = custSelect.value || 'WALK-IN';
      const customerName = custSelect.options[custSelect.selectedIndex].text.split('(')[0].trim() || 'Walk-in Customer';
      
      const paymentMethod = document.querySelector('input[name="payment"]:checked').value;
      
      const subtotal = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
      const taxRate = Storage.getSettings().taxRate / 100;
      const tax = subtotal * taxRate;
      const total = subtotal + tax;
      
      const sale = {
        customerId,
        customerName,
        items: cart.map(i => ({ productId: i.productId, qty: i.qty, price: i.price })),
        subtotal,
        tax,
        total,
        status: 'Paid',
        paymentMethod
      };
      
      const savedSale = Storage.addSale(sale);
      
      Utils.showToast('Payment Successful', `Invoice ${savedSale.id} generated.`, 'success');
      clearCart();
      
      // Update product list to reflect new stock
      posProducts = Storage.getProducts();
      renderPosProducts(posProducts);
      App.updateNotificationsBadge(); // update stock warnings
    }
  </script>
</body>
</html>
