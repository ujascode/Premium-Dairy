<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings | Premium Dairy SaaS</title>
  
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/layout.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <link rel="stylesheet" href="../assets/css/forms.css">
  <link rel="stylesheet" href="../assets/css/animations.css">
</head>
<body class="animate-fade-in">

  <div class="app-container">
    <div id="sidebar-container"></div>
    <main class="main-wrapper">
      <div id="navbar-container"></div>

      <div class="page-content">
        <div class="page-header">
          <div class="page-title">
            <h1 class="text-h2">Store Settings</h1>
          </div>
          <div class="page-actions">
            <button class="btn btn-primary ripple" onclick="saveSettings()"><i class="ph ph-floppy-disk"></i> Save Changes</button>
          </div>
        </div>

        <div class="dashboard-grid">
          
          <div class="card" style="grid-column: span 8;">
            <div class="card-header">
              <h3 class="card-title">General Information</h3>
            </div>
            <div class="card-body">
              <div class="form-group">
                <label class="form-label">Business Name</label>
                <input type="text" id="s-biz-name" class="form-control">
              </div>
              <div class="flex gap-4">
                <div class="form-group flex-1">
                  <label class="form-label">Currency Symbol</label>
                  <select id="s-currency" class="form-control">
                    <option value="₹">₹ (INR)</option>
                    <option value="$">$ (USD)</option>
                    <option value="€">€ (EUR)</option>
                    <option value="£">£ (GBP)</option>
                  </select>
                </div>
                <div class="form-group flex-1">
                  <label class="form-label">Tax Rate (%)</label>
                  <input type="number" id="s-tax" class="form-control" step="0.1">
                </div>
              </div>
            </div>
          </div>
          
          <div class="card" style="grid-column: span 4;">
            <div class="card-header">
              <h3 class="card-title">Preferences</h3>
            </div>
            <div class="card-body flex flex-col gap-4">
              <div class="flex items-center justify-between p-3 bg-surface border rounded">
                <div>
                  <div class="font-medium">Dark Mode</div>
                  <div class="text-xs text-secondary">Switch between light and dark themes</div>
                </div>
                <label class="toggle-switch">
                  <input type="checkbox" id="s-theme" onchange="toggleDark(this)">
                  <span class="toggle-slider"></span>
                </label>
              </div>
              
              <div class="flex items-center justify-between p-3 bg-surface border rounded">
                <div>
                  <div class="font-medium">Push Notifications</div>
                  <div class="text-xs text-secondary">Get alerts for low stock and new orders</div>
                </div>
                <label class="toggle-switch">
                  <input type="checkbox" id="s-notifs" checked>
                  <span class="toggle-slider"></span>
                </label>
              </div>
            </div>
          </div>
          
        </div>
      </div>
    </main>
  </div>

  <style>
    /* Custom Toggle Switch for Settings */
    .toggle-switch {
      position: relative;
      display: inline-block;
      width: 44px;
      height: 24px;
    }
    .toggle-switch input { opacity: 0; width: 0; height: 0; }
    .toggle-slider {
      position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
      background-color: var(--color-border);
      transition: .3s; border-radius: 24px;
    }
    .toggle-slider:before {
      position: absolute; content: ""; height: 18px; width: 18px;
      left: 3px; bottom: 3px; background-color: white;
      transition: .3s; border-radius: 50%;
    }
    input:checked + .toggle-slider { background-color: var(--color-brand); }
    input:checked + .toggle-slider:before { transform: translateX(20px); }
  </style>

  <script src="../assets/js/storage.js"></script>
  <script src="../assets/js/utils.js"></script>
  <script src="../assets/js/theme.js"></script>
  <script src="../assets/js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      setTimeout(() => {
        const settings = Storage.getSettings();
        document.getElementById('s-biz-name').value = settings.businessName;
        document.getElementById('s-currency').value = settings.currency;
        document.getElementById('s-tax').value = settings.taxRate;
        document.getElementById('s-theme').checked = settings.theme === 'dark';
        document.getElementById('s-notifs').checked = settings.notifications;
      }, 50);
    });

    function toggleDark(el) {
      if (el.checked) {
        Storage.updateSettings({ theme: 'dark' });
        Theme.applyTheme('dark');
      } else {
        Storage.updateSettings({ theme: 'light' });
        Theme.applyTheme('light');
      }
    }

    function saveSettings() {
      const btn = event.currentTarget;
      const prevHtml = btn.innerHTML;
      btn.innerHTML = '<i class="ph ph-spinner ph-spin"></i> Saving...';
      
      const newSettings = {
        businessName: document.getElementById('s-biz-name').value,
        currency: document.getElementById('s-currency').value,
        taxRate: parseFloat(document.getElementById('s-tax').value),
        theme: document.getElementById('s-theme').checked ? 'dark' : 'light',
        notifications: document.getElementById('s-notifs').checked
      };
      
      setTimeout(() => {
        Storage.updateSettings(newSettings);
        Utils.showToast('Settings Saved', 'Your store preferences have been updated.', 'success');
        btn.innerHTML = prevHtml;
        
        // Update sidebar logo name
        const logoText = document.querySelector('.logo-text');
        if (logoText) logoText.textContent = newSettings.businessName;
      }, 800);
    }
  </script>
</body>
</html>
